<!DOCTYPE HTML>
<!--
	WhatsApp Benzeri Mesajlaşma Arayüzü
-->
<html>
	<head>
		<title>msjAt - Mesajlaşma</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/style.css" />
		<link rel="stylesheet" href="assets/css/dashboard.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
	</head>
	<body class="dashboard-body">

		<!-- Ana Container -->
		<div class="chat-container">
			
			<!-- Sol Panel - Arkadaşlar Listesi -->
			<div class="contacts-panel">
				<!-- Header -->
				<div class="contacts-header">
					<div class="user-info">
						<img src="images/logoWhite.png" alt="Avatar" class="user-avatar">
						<span class="user-name" id="currentUser">Kullanıcı</span>
					</div>
					<div class="header-actions">
						<button class="icon-btn" title="Yeni Mesaj">💬</button>
						<button class="icon-btn" title="Ayarlar">⚙️</button>
						<button class="icon-btn logout-btn" title="Çıkış">🚪</button>
					</div>
				</div>

				<!-- Arama -->
				<div class="search-box">
					<input type="text" placeholder="Kişi ara..." class="search-input">
				</div>

				<!-- Arkadaşlar Listesi -->
				<div class="contacts-list">
					
				</div>
			</div>

			<!-- Sağ Panel - Mesajlaşma Alanı -->
			<div class="chat-panel">
				<!-- Chat Header -->
				<div class="chat-header">
					<div class="chat-user-info">
						<img src="https://via.placeholder.com/40/667eea/ffffff?text=J" alt="John" class="chat-avatar">
						<div class="chat-user-details">
							<div class="chat-user-name">John Doe</div>
							<div class="chat-user-status">Çevrimiçi</div>
						</div>
					</div>
					<div class="chat-actions">
						<button class="icon-btn" title="Arama">🔍</button>
						<button class="icon-btn" title="Video">📹</button>
						<button class="icon-btn" title="Sesli">📞</button>
						<button class="icon-btn" title="Menü">⋮</button>
					</div>
				</div>

				<!-- Mesajlar Alanı -->
				<div class="messages-container">

				</div>

				<!-- Mesaj Gönderme Alanı -->
				<div class="message-input-container">
					<div class="message-input-wrapper">
						<button class="attach-btn" title="Dosya Ekle">📎</button>
						<input type="text" placeholder="Mesajınızı yazın..." class="message-input">
						<button class="send-btn" title="Gönder">➤</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Scripts -->
		<script src="assets/js/starting/breakpoints.min.js"></script>
		<script src="assets/js/starting/browser.min.js"></script>
		<script src="assets/js/starting/jquery.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script type="module" src="assets/js/dashboard.js"></script>
		<script type="module" src="assets/js/database-auth.js"></script>

	</body>
</html>
